<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" fill="none" class="how-it-works">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Step 1: Lembrete -->
  <g transform="translate(80, 60)">
    <rect x="-40" y="-40" width="80" height="80" rx="20" fill="#1b2436" stroke="#1f2a40"/>
    <text x="0" y="5" text-anchor="middle" font-size="36">🔔</text>
    <animate attributeName="y" values="60;55;60" dur="2s" repeatCount="indefinite"/>
  </g>
  <text x="80" y="175" text-anchor="middle" font-size="12" fill="#93a0bd" font-family="system-ui">Lembrete</text>
  <text x="80" y="190" text-anchor="middle" font-size="10" fill="#5b6680" font-family="system-ui">A cada 30 min</text>

  <!-- Seta 1 -->
  <g transform="translate(170, 100)">
    <path d="M0 0 L40 0" stroke="#1f2a40" stroke-width="2" stroke-dasharray="4 3"/>
    <path d="M35 -5 L40 0 L35 5" stroke="#1f2a40" stroke-width="2" fill="none"/>
  </g>

  <!-- Step 2: Beber -->
  <g transform="translate(260, 60)">
    <rect x="-40" y="-40" width="80" height="80" rx="20" fill="#1b2436" stroke="#1f2a40"/>
    <text x="0" y="5" text-anchor="middle" font-size="36">🥤</text>
    <animate attributeName="y" values="60;65;60" dur="2s" begin="0.5s" repeatCount="indefinite"/>
  </g>
  <text x="260" y="175" text-anchor="middle" font-size="12" fill="#93a0bd" font-family="system-ui">Beber</text>
  <text x="260" y="190" text-anchor="middle" font-size="10" fill="#5b6680" font-family="system-ui">200 / 250 / 500 / 750 ml</text>

  <!-- Seta 2 -->
  <g transform="translate(350, 100)">
    <path d="M0 0 L40 0" stroke="#1f2a40" stroke-width="2" stroke-dasharray="4 3"/>
    <path d="M35 -5 L40 0 L35 5" stroke="#1f2a40" stroke-width="2" fill="none"/>
  </g>

  <!-- Step 3: Garrafa enche -->
  <g transform="translate(440, 60)">
    <rect x="-40" y="-40" width="80" height="80" rx="20" fill="#1b2436" stroke="#1f2a40"/>
    <text x="0" y="5" text-anchor="middle" font-size="36">🫗</text>
    <animate attributeName="y" values="60;55;60" dur="2s" begin="1s" repeatCount="indefinite"/>
  </g>
  <text x="440" y="175" text-anchor="middle" font-size="12" fill="#93a0bd" font-family="system-ui">Garrafa enche</text>
  <text x="440" y="190" text-anchor="middle" font-size="10" fill="#5b6680" font-family="system-ui">+10% / +20% / +30%</text>

  <!-- Seta 3 -->
  <g transform="translate(530, 100)">
    <path d="M0 0 L40 0" stroke="#1f2a40" stroke-width="2" stroke-dasharray="4 3"/>
    <path d="M35 -5 L40 0 L35 5" stroke="#1f2a40" stroke-width="2" fill="none"/>
  </g>

  <!-- Step 4: Streak -->
  <g transform="translate(620, 60)">
    <rect x="-40" y="-40" width="80" height="80" rx="20" fill="#1b2436" stroke="#1f2a40"/>
    <text x="0" y="5" text-anchor="middle" font-size="36">🔥</text>
    <animate attributeName="y" values="60;55;60" dur="2s" begin="1.5s" repeatCount="indefinite"/>
  </g>
  <text x="620" y="175" text-anchor="middle" font-size="12" fill="#93a0bd" font-family="system-ui">Streak</text>
  <text x="620" y="190" text-anchor="middle" font-size="10" fill="#5b6680" font-family="system-ui">Dias seguidos</text>

  <!-- Linha de progresso conectando tudo -->
  <rect x="76" y="54" width="548" height="4" rx="2" fill="#1f2a40"/>
  <rect x="76" y="54" width="137" height="4" rx="2" fill="url(#g1)" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.8;0.5" dur="2s" repeatCount="indefinite"/>
  </rect>

  <!-- Meta badge no final -->
  <g transform="translate(720, 60)">
    <text x="0" y="5" text-anchor="middle" font-size="20" filter="url(#glow)">🎯</text>
  </g>
  <text x="720" y="175" text-anchor="middle" font-size="12" fill="#22c55e" font-family="system-ui">Meta!</text>
</svg>
